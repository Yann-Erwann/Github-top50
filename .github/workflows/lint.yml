name: Lint

on:
  push:
    paths:
      - "scripts/**"
      - "requirements.txt"
  pull_request:
    paths:
      - "scripts/**"
      - "requirements.txt"

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff linter
        run: ruff check scripts/

      - name: Run Ruff formatter check
        run: ruff format --check scripts/
