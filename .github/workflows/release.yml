name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Verify lockfile
        run: python -m uv lock --check

      - name: Sync development dependencies
        run: python -m uv sync --frozen --extra dev

      - name: Validate release candidate
        run: |
          python -m uv run --frozen --extra dev ruff check src scripts tests
          python -m uv run --frozen --extra dev pytest -q

      - name: Build distribution artifacts
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Generate release SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Generate release checksums
        run: sha256sum dist/* > dist/checksums.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          dist/*
          sbom.cdx.json
          --generate-notes
          --verify-tag
