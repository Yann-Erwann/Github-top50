name: Repository Labels

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repository-labels.yml"

permissions:
  issues: write

jobs:
  sync-labels:
    name: Ensure automation labels
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Create or update labels used by Dependabot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          ensure_label() {
            local name="$1"
            local color="$2"
            local description="$3"

            if gh label view "$name" --repo "$REPOSITORY" >/dev/null 2>&1; then
              gh label edit "$name" \
                --repo "$REPOSITORY" \
                --color "$color" \
                --description "$description"
            else
              gh label create "$name" \
                --repo "$REPOSITORY" \
                --color "$color" \
                --description "$description"
            fi
          }

          ensure_label "dependencies" "0366d6" "Dependency updates and dependency maintenance."
          ensure_label "ci" "5319e7" "Continuous integration and workflow changes."
