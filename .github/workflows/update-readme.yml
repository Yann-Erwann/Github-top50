name: Update README Top 50 GitHub Stars

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
  push:
    paths:
      - ".github/workflows/update-readme.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/**"
      - "src/**"

concurrency:
  group: update-readme-top50
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync development dependencies
        run: python -m uv sync --frozen --extra dev

      - name: Generate README section
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m uv run --frozen python scripts/build_top50.py

      - name: Validate generated README
        run: python -m uv run --frozen --extra dev pytest -q tests/integration/test_readme_links.py

      - name: Open pull request if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          if git diff --quiet -- README.md; then
            echo "README.md unchanged."
            exit 0
          fi

          branch="chore/update-readme-top50"
          title="chore(readme): update top 50 github stars"
          pr_body="Automated README refresh generated by GitHub Actions."

          find_existing_pr() {
            gh pr list \
              --state open \
              --json number,headRefName \
              --jq '.[] | select(.headRefName == "'"${branch}"'") | .number' \
              | head -n1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add README.md
          git commit -m "$title"
          git push --force-with-lease origin "HEAD:${branch}"

          existing_pr="$(find_existing_pr)"
          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" --title "$title" --body "$pr_body"
            echo "Updated existing pull request #$existing_pr for ${branch}."
            exit 0
          fi

          set +e
          create_output="$(
            gh pr create \
              --base main \
              --head "${REPOSITORY_OWNER}:${branch}" \
              --title "$title" \
              --body "$pr_body" 2>&1
          )"
          create_status=$?
          set -e

          if [ "$create_status" -ne 0 ]; then
            existing_pr="$(find_existing_pr)"
            if [ -n "$existing_pr" ]; then
              gh pr edit "$existing_pr" --title "$title" --body "$pr_body"
              echo "Pull request #$existing_pr already existed after push; updated instead."
              exit 0
            fi

            echo "$create_output"
            exit "$create_status"
          fi

          echo "$create_output"
