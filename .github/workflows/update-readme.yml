name: Update README Top 50 GitHub Stars

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
  push:
    paths:
      - ".github/workflows/update-readme.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/**"
      - "src/**"

concurrency:
  group: update-readme-top50
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync runtime dependencies
        run: python -m uv sync --frozen

      - name: Generate README section
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m uv run --frozen python scripts/build_top50.py

      - name: Open pull request if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md unchanged."
            exit 0
          fi

          branch="chore/update-readme-top50"
          title="chore(readme): update top 50 github stars"
          head_ref="${REPOSITORY_OWNER}:${branch}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add README.md
          git commit -m "$title"
          git push --force-with-lease origin "HEAD:${branch}"

          existing_pr="$(gh pr list --head "$head_ref" --base main --state open --json number --jq '.[0].number')"
          if [ -n "$existing_pr" ]; then
            echo "Pull request #$existing_pr already exists for ${head_ref}."
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$head_ref" \
            --title "$title" \
            --body "Automated README refresh generated by GitHub Actions."
