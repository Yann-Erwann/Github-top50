name: Update README Top 50 GitHub Stars

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-readme.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/**"
      - "src/**"

concurrency:
  group: update-readme-top50
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.PR_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Prepare automation branch
        run: |
          set -euo pipefail

          branch="chore/update-readme-top50"

          git config user.name "Yann-Erwann Le Calvez"
          git config user.email "Yann-Erwann@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git switch -C "$branch" "origin/$branch"
            git merge --no-edit origin/main
          else
            git switch -C "$branch" origin/main
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv>=0.11.15"

      - name: Verify lockfile
        run: python -m uv lock --check

      - name: Sync development dependencies
        run: python -m uv sync --frozen --extra dev

      - name: Generate README section
        env:
          GITHUB_TOKEN: ${{ secrets.PR_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
        run: python -m uv run --frozen python scripts/build_top50.py

      - name: Validate generated README
        run: python -m uv run --frozen --extra dev pytest -q tests/integration/test_readme_links.py

      - name: Open pull request if changed
        env:
          GH_TOKEN: ${{ secrets.PR_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          PR_AUTOMATION_TOKEN: ${{ secrets.PR_AUTOMATION_TOKEN }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain -- README.md data/top50)" ]; then
            echo "README.md and snapshots unchanged."
            exit 0
          fi

          branch="chore/update-readme-top50"
          title="chore(readme): update top 50 github stars"
          pr_body="Automated README refresh generated by GitHub Actions."

          find_existing_pr() {
            gh pr list \
              --state open \
              --json number,headRefName \
              --jq '.[] | select(.headRefName == "'"${branch}"'") | .number' \
              | head -n1
          }

          trigger_validation_workflows() {
            if [ -n "${PR_AUTOMATION_TOKEN:-}" ]; then
              echo "PR_AUTOMATION_TOKEN is configured; pull_request workflows will trigger from the push."
              return 0
            fi

            echo "Using GITHUB_TOKEN fallback; dispatching validation workflows explicitly."
            for workflow in ci.yml security.yml codeql.yml; do
              gh workflow run "$workflow" --ref "$branch" \
                || echo "::warning::Unable to dispatch ${workflow} for ${branch}."
            done
          }

          git add README.md data/top50
          git commit -m "$title"
          git push origin "HEAD:${branch}"

          existing_pr="$(find_existing_pr)"
          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" --title "$title" --body "$pr_body"
            echo "Updated existing pull request #$existing_pr for ${branch}."
            trigger_validation_workflows
            exit 0
          fi

          set +e
          create_output="$(
            gh pr create \
              --base main \
              --head "${REPOSITORY_OWNER}:${branch}" \
              --title "$title" \
              --body "$pr_body" 2>&1
          )"
          create_status=$?
          set -e

          if [ "$create_status" -ne 0 ]; then
            existing_pr="$(find_existing_pr)"
            if [ -n "$existing_pr" ]; then
              gh pr edit "$existing_pr" --title "$title" --body "$pr_body"
              echo "Pull request #$existing_pr already existed after push; updated instead."
              trigger_validation_workflows
              exit 0
            fi

            echo "$create_output"
            exit "$create_status"
          fi

          echo "$create_output"
          trigger_validation_workflows
