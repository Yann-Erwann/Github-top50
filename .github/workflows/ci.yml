name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-lint:
    name: Validate GitHub workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync dependencies
        run: python -m uv sync --frozen --extra dev

      - name: Run Ruff linter
        run: python -m uv run --frozen --extra dev ruff check src scripts tests

      - name: Run Ruff formatter check
        run: python -m uv run --frozen --extra dev ruff format --check src scripts tests

      - name: Run tests with coverage
        run: >
          python -m uv run --frozen --extra dev
          pytest -v
          --cov=src/github_top50
          --cov=scripts
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=85
