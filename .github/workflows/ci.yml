name: CI

on:
  push:
    paths:
      - ".github/workflows/**"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "requirements.txt"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync dependencies
        run: python -m uv sync --frozen --extra dev

      - name: Run Ruff linter
        run: python -m uv run --frozen --extra dev ruff check src scripts tests

      - name: Run Ruff formatter check
        run: python -m uv run --frozen --extra dev ruff format --check src scripts tests

      - name: Run tests with coverage
        run: >
          python -m uv run --frozen --extra dev
          pytest tests/ -v
          --cov=src/github_top50
          --cov=scripts
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=85
