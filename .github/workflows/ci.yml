name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-lint:
    name: Validate GitHub workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Verify lockfile
        run: python -m uv lock --check

      - name: Sync dependencies
        run: python -m uv sync --frozen --extra dev

      - name: Run Ruff linter
        run: python -m uv run --frozen --extra dev ruff check src scripts tests

      - name: Run Ruff formatter check
        run: python -m uv run --frozen --extra dev ruff format --check src scripts tests

      - name: Run tests with coverage
        run: >
          python -m uv run --frozen --extra dev
          pytest -v
          --cov=src/github_top50
          --cov=scripts
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=85

  site-build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Verify lockfile
        run: python -m uv lock --check

      - name: Sync runtime dependencies
        run: python -m uv sync --frozen

      - name: Export consolidated site data
        run: >
          python -m uv run --frozen python scripts/export_site_data.py
          --output-path site/public/data/site-data.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build Astro site
        working-directory: site
        run: npm run build

  site-lighthouse:
    name: Lighthouse 100 audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Verify lockfile
        run: python -m uv lock --check

      - name: Sync runtime dependencies
        run: python -m uv sync --frozen

      - name: Export consolidated site data
        run: >
          python -m uv run --frozen python scripts/export_site_data.py
          --output-path site/public/data/site-data.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build Astro site
        working-directory: site
        run: npm run build

      - name: Audit all built pages with Lighthouse
        working-directory: site
        run: npm run lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: site/.lighthouseci
          if-no-files-found: ignore
