name: Security

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 7 * * 1"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv>=0.11.15"

      - name: Verify lockfile
        run: python -m uv lock --check

      - name: Sync dependencies
        run: python -m uv sync --frozen --extra dev

      - name: Audit dependencies
        # These advisories affect the uv-managed pip in the audit environment.
        # Keep pip-audit blocking for project dependency advisories.
        run: >
          python -m uv run --frozen --extra dev pip-audit
          --ignore-vuln CVE-2026-3219
          --ignore-vuln CVE-2026-6357
          --ignore-vuln PYSEC-2026-196

  frontend-dependency-audit:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Audit site dependencies
        working-directory: site
        run: npm audit --audit-level=high

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv>=0.11.15"

      - name: Verify lockfile
        run: python -m uv lock --check

      - name: Sync dependencies
        run: python -m uv sync --frozen --extra dev

      - name: Run Bandit
        run: python -m uv run --frozen --extra dev bandit -q -r src scripts

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error

  zap-baseline:
    name: OWASP ZAP baseline
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv>=0.11.15"

      - name: Verify lockfile
        run: python -m uv lock --check

      - name: Sync runtime dependencies
        run: python -m uv sync --frozen

      - name: Export consolidated site data
        run: >
          python -m uv run --frozen python scripts/export_site_data.py
          --output-path site/public/data/site-data.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build Astro site
        working-directory: site
        run: npm run build

      - name: Start Astro preview
        working-directory: site
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > ../astro-preview.log 2>&1 &
          echo "$!" > ../astro-preview.pid

      - name: Wait for preview
        run: |
          for _attempt in {1..30}; do
            if curl -fs http://127.0.0.1:4321/Github-top50/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat astro-preview.log
          exit 1

      - name: Run OWASP ZAP baseline
        run: |
          mkdir -p zap-reports
          chmod 777 zap-reports
          docker run --rm --network host \
            -v "${{ github.workspace }}/zap-reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t http://127.0.0.1:4321/Github-top50/ \
              -I \
              -r zap-baseline.html \
              -J zap-baseline.json \
              -w zap-baseline.md

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-baseline-reports
          path: zap-reports
          if-no-files-found: ignore

      - name: Stop Astro preview
        if: always()
        run: |
          if [ -f astro-preview.pid ]; then
            kill "$(cat astro-preview.pid)" || true
          fi
