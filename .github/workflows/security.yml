name: Security

on:
  push:
    paths:
      - ".github/workflows/**"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/**"
      - "src/**"
      - "requirements.txt"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/**"
      - "src/**"
      - "requirements.txt"
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync dependencies
        run: python -m uv sync --frozen --extra dev

      - name: Audit dependencies
        run: python -m uv run --frozen --extra dev pip-audit

  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync dependencies
        run: python -m uv sync --frozen --extra dev

      - name: Run Bandit
        run: python -m uv run --frozen --extra dev bandit -q -r src scripts
