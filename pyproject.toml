[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "github-top50"
version = "0.1.0"
description = "Generate curated GitHub Top 50 sections inside a README."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Yann-Erwann Le Calvez" }
]
dependencies = [
  "requests==2.34.2"
]

[project.optional-dependencies]
dev = [
  "bandit[toml]>=1.9.4,<2",
  "msgpack>=1.2.1,<2",
  "pip-audit>=2.10.1,<3",
  "pytest==9.1.1",
  "pytest-cov>=7.1.0,<8",
  "ruff>=0.16.2,<0.17"
]

[project.scripts]
github-top50 = "github_top50.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
targets = ["src", "scripts"]
